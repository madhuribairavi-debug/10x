<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Madhuri's Homepage</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 60px 40px;
            text-align: center;
            max-width: 600px;
            animation: slideIn 0.6s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        h1 {
            color: #667eea;
            font-size: 3em;
            margin-bottom: 20px;
        }
        
        .name {
            color: #764ba2;
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 30px;
        }
        
        p {
            color: #555;
            font-size: 1.2em;
            line-height: 1.8;
            margin-bottom: 20px;
        }
        
        .welcome-msg {
            background: #f0f4ff;
            padding: 20px;
            border-left: 4px solid #667eea;
            margin: 30px 0;
            border-radius: 5px;
        }
        
        .cta-button {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to</h1>
        <div class="name">Madhuri's Homepage</div>
        
        <div class="welcome-msg">
            <p>🎉 Hello! I'm glad you're here.</p>
        </div>
        
        <p>This is a special welcome page dedicated to Madhuri. Feel free to explore and get to know more about this amazing space.</p>
        
        <p>Whether you're here for the first time or coming back, we're delighted to have you!</p>
        
        <button class="cta-button">Get Started</button>
    </div>
</body>
</html>
