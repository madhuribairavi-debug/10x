<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Madhuri's Homepage</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1abc9c 0%, #16a085 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: #f8fcfb;
            border-radius: 20px;
            box-shadow: 0 18px 45px rgba(22, 160, 133, 0.18);
            padding: 60px 45px;
            text-align: center;
            max-width: 620px;
            animation: slideIn 0.6s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        h1 {
            color: #0d564b;
            font-size: 3em;
            margin-bottom: 20px;
        }
        
        .name {
            color: #117a65;
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 30px;
        }
        
        p {
            color: #2d4f4a;
            font-size: 1.2em;
            line-height: 1.8;
            margin-bottom: 20px;
        }
        
        .welcome-msg {
            background: rgba(255, 255, 255, 0.9);
            padding: 22px;
            border-left: 4px solid #16a085;
            margin: 30px 0;
            border-radius: 8px;
        }
        
        .cta-button {
            display: inline-block;
            background: linear-gradient(135deg, #16a085 0%, #1abc9c 100%);
            color: white;
            padding: 14px 34px;
            border: none;
            border-radius: 30px;
            font-size: 1em;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(26, 188, 156, 0.35);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to</h1>
        <div class="name">Madhuri's Homepage</div>
        
        <div class="welcome-msg">
            <p>🎉 Hello! I'm glad you're here.</p>
        </div>
        
        <p>This is a special welcome page dedicated to Madhuri. Feel free to explore and get to know more about this amazing space.</p>
        
        <p>Whether you're here for the first time or coming back, we're delighted to have you!</p>
        
        <button class="cta-button">Get Started</button>
    </div>
</body>
</html>
